spring.application.name=monitor_pc

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

agent.registration-secret=${AGENT_REGISTRATION_SECRET}

rsa.public-key=${RSA_PUBLIC_KEY_PATH:classpath:certs/public.pem}
rsa.private-key=${RSA_PRIVATE_KEY_PATH:classpath:certs/private.pem}

app.cors.allowed-origin=${FRONTEND_URL:http://localhost:4200}

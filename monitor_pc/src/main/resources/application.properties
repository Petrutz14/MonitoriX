spring.application.name=monitor_pc
! Postgres
spring.datasource.url=jdbc:postgresql://localhost:5432/pc_monitor
spring.datasource.username=admin
spring.datasource.password=admin


! JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

! Secret header agents must present to self-register
agent.registration-secret=demo_secret

! JWT RSA
rsa.public-key=classpath:certs/public.pem
rsa.private-key=classpath:certs/private.pem

app.cors.allowed-origin=http://localhost:4200